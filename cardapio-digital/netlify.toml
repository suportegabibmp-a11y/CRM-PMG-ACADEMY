# Na Netlify, defina "Base directory" = cardapio-digital
#
# As páginas são arquivos estáticos. A API roda como Edge Function no Supabase
# (que já tem acesso ao banco, sem senha nenhuma aqui). Só o Stripe roda na
# Netlify, porque as chaves dele estão nas variáveis de ambiente daqui.
[build]
  command = "npm install"
  publish = "public"
  # Só faz build quando algo publicado na Netlify muda (páginas, função do
  # Stripe, configuração ou dependências). Mudanças só no servidor (Supabase)
  # ou na documentação não gastam créditos de build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify netlify.toml package.json package-lock.json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["stripe"]

# Webhook do Stripe: fica na Netlify, que tem o segredo de assinatura.
[[redirects]]
  from = "/api/webhooks/stripe"
  to = "/.netlify/functions/stripe/webhook"
  status = 200
  force = true

# Resto da API: Edge Function "api" do Supabase.
[[redirects]]
  from = "/api/*"
  to = "https://emowbrpmoofomhzcqpbz.supabase.co/functions/v1/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/m/*"
  to = "/menu.html"
  status = 200

[[redirects]]
  from = "/pedido/*"
  to = "/order.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Cabeçalhos de segurança de todas as páginas.
# CSP: só scripts do próprio site (nada embutido no HTML); imagens de https,
# data: e blob: (prévia de fotos); nenhuma página pode ser colocada em iframe.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
