<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acompanhar pedido</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
    .top { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
    .top img, .top .ph { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; }
    .top .ph { display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); font-weight: 800; font-size: 1.3rem; }
    .card + .card { margin-top: 14px; }
    .steps { list-style: none; padding: 0; margin: 0; }
    .steps li { display: flex; gap: 12px; align-items: center; padding: 8px 0; color: var(--muted); }
    .steps li .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; }
    .steps li.done { color: var(--ink); }
    .steps li.done .dot { background: var(--brand); border-color: var(--brand); }
    .steps li.current { font-weight: 700; }
    .steps li.current .dot { box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 25%, transparent); }
    .qr { display: grid; place-items: center; background: #fff; padding: 12px; border-radius: 12px; width: 240px; height: 240px; margin: 12px auto; }
    .qr img, .qr svg { width: 100%; height: 100%; }
    .pix-code { font-family: ui-monospace, monospace; font-size: .75rem; word-break: break-all; background: var(--surface-2); padding: 10px; border-radius: 8px; max-height: 80px; overflow: auto; }
    .line { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
    .line.total { font-weight: 800; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
    .big-status { font-size: 1.4rem; font-weight: 800; margin: 4px 0 0; }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="empty">Carregando pedido…</div></div>
  <script src="/vendor/qrcode.js"></script>
  <script src="/common.js"></script>
  <script src="/order.js"></script>
</body>
</html>
