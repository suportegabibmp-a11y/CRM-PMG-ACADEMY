<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Cardápio Digital</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height: 100vh; }
    .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
    aside { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
    aside .brand { font-weight: 800; padding: 6px 10px 18px; display: flex; gap: 8px; align-items: center; }
    aside .brand i { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-style: normal; }
    .nav-btn { display: flex; gap: 10px; align-items: center; border: 0; background: none; padding: 10px 12px; border-radius: 10px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; text-align: left; }
    .nav-btn:hover { background: var(--surface-2); color: var(--ink); }
    .nav-btn.active { background: color-mix(in srgb, var(--brand) 12%, transparent); color: var(--brand); }
    .nav-btn .count { margin-left: auto; background: var(--brand); color: var(--brand-ink); border-radius: 999px; font-size: .75rem; padding: 1px 8px; }
    main { padding: 24px; min-width: 0; }
    .topbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .topbar h1 { margin: 0; font-size: 1.5rem; }
    .switch-open { display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
    .toggle { position: relative; width: 44px; height: 26px; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .2s; }
    .toggle span::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .toggle input:checked + span { background: var(--ok); }
    .toggle input:checked + span::before { transform: translateX(18px); }
    .banner { padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-weight: 600; background: rgba(183,121,31,.14); color: var(--warn); }
    .banner.danger { background: rgba(197,48,48,.12); color: var(--danger); }
    .banner a { color: inherit; }
    .img-preview { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); flex-shrink: 0; }
    .upload-btn.loading { opacity: .6; pointer-events: none; }
    .plan-card.current { border: 2px solid var(--brand); }
    .plan-card .price { font-size: 1.8rem; font-weight: 800; margin: 6px 0 10px; }
    .plan-card ul { padding-left: 18px; color: var(--muted); margin: 0 0 16px; }

    .board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; align-items: start; }
    .col { background: var(--surface-2); border-radius: var(--radius); padding: 12px; min-height: 200px; }
    .col h3 { font-size: .95rem; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .ocard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: .9rem; }
    .ocard.new { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }
    .ocard .items { margin: 8px 0; padding: 8px 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
    .ocard .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat .v { font-size: 1.6rem; font-weight: 800; }
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
    .bars div { flex: 1; background: var(--brand); border-radius: 6px 6px 0 0; min-height: 2px; position: relative; }
    .bars-labels { display: flex; gap: 6px; font-size: .7rem; color: var(--muted); }
    .bars-labels span { flex: 1; text-align: center; }

    .cat-block { margin-bottom: 22px; }
    .cat-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .cat-head h3 { margin: 0; flex: 1; }
    .prow { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
    .prow img, .prow .noimg { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
    .prow .txt { flex: 1; min-width: 0; }
    .prow .txt .muted { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prow.off { opacity: .55; }
    .addon-row { display: grid; grid-template-columns: 1fr 110px auto; gap: 8px; margin-bottom: 8px; }
    .settings { display: grid; gap: 16px; max-width: 760px; }
    .settings h2 { font-size: 1.1rem; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    .qrbox { background: #fff; padding: 16px; border-radius: 12px; width: 220px; }
    .qrbox svg { width: 100%; height: auto; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
      aside .brand, aside .aside-footer { display: none; }
      .nav-btn { white-space: nowrap; }
      main { padding: 16px; }
      .board { grid-template-columns: repeat(4, 260px); }
    }

    #print-area { display: none; }
    @media print {
      body > *:not(#print-area) { display: none !important; }
      #print-area { display: block; font-family: ui-monospace, monospace; font-size: 12px; width: 72mm; color: #000; }
      #print-area hr { border: 0; border-top: 1px dashed #000; }
    }
  </style>
</head>
<body>
  <div class="layout hidden" id="layout">
    <aside>
      <div class="brand"><i>🍔</i><span id="rname">Painel</span></div>
      <button class="nav-btn" data-view="orders">🔔 Pedidos <span class="count hidden" id="order-count"></span></button>
      <button class="nav-btn" data-view="menu">📋 Cardápio</button>
      <button class="nav-btn" data-view="reports">📊 Relatórios</button>
      <button class="nav-btn" data-view="share">🔗 Divulgar</button>
      <button class="nav-btn" data-view="settings">⚙️ Configurações</button>
      <button class="nav-btn" data-view="billing">💳 Assinatura</button>
      <button class="nav-btn hidden" data-view="superadmin" id="nav-superadmin">🛡️ Clientes do SaaS <span class="count hidden" id="reset-count"></span></button>
      <div class="spacer"></div>
      <div class="aside-footer">
        <button class="nav-btn" id="logout">↩ Sair</button>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <h1 id="view-title"></h1>
        <div class="spacer"></div>
        <label class="switch-open"><span id="open-label"></span><span class="toggle"><input type="checkbox" id="open-toggle"><span></span></span></label>
        <a class="btn" id="view-menu" target="_blank" rel="noopener">Ver cardápio ↗</a>
      </div>
      <div id="banners"></div>
      <div id="view"></div>
    </main>
  </div>
  <div id="print-area"></div>
  <script src="/vendor/qrcode.js"></script>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
