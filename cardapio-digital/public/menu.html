<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cardápio</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .hero { position: relative; height: 180px; background: var(--brand) center/cover no-repeat; }
    .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.45)); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
    .head { position: relative; margin-top: -48px; z-index: 1; display: flex; gap: 16px; align-items: flex-end; }
    .logo { width: 96px; height: 96px; border-radius: 20px; object-fit: cover; border: 4px solid var(--surface); background: var(--surface); box-shadow: var(--shadow); flex-shrink: 0; }
    .logo.placeholder { display: grid; place-items: center; font-size: 2.2rem; font-weight: 800; color: var(--brand-ink); background: var(--brand); }
    .info { padding: 14px 0 6px; }
    .info h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .88rem; color: var(--muted); margin-top: 8px; }
    .tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 16px; }
    .tabs .wrap { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
    .tab { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer; }
    .tab.active { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
    .search { margin: 16px 0 0; }
    section.cat { padding-top: 22px; scroll-margin-top: 64px; }
    section.cat h2 { font-size: 1.2rem; }
    .products { display: grid; gap: 12px; }
    @media (min-width: 720px) { .products { grid-template-columns: 1fr 1fr; } }
    .product { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; transition: box-shadow .15s; }
    .product:hover { box-shadow: var(--shadow); }
    .product .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .product h3 { font-size: 1rem; margin: 0 0 4px; }
    .product p { margin: 0; font-size: .85rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product .price { margin-top: auto; padding-top: 8px; font-weight: 700; }
    .product img { width: 104px; height: 104px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .closed-banner { background: rgba(197,48,48,.12); color: var(--danger); font-weight: 600; padding: 12px 16px; border-radius: 12px; margin-top: 16px; }
    .cartbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 20; }
    .cartbar .btn { max-width: 828px; margin: 0 auto; display: flex; justify-content: space-between; }
    .pimg { width: 100%; height: 220px; object-fit: cover; }
    .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; }
    .qty button { border: 0; background: none; color: var(--brand); font-size: 1.3rem; font-weight: 700; width: 40px; height: 40px; cursor: pointer; }
    .qty span { min-width: 28px; text-align: center; font-weight: 700; }
    .addon { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .addon:last-child { border-bottom: 0; }
    .opt { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; font-weight: 600; }
    .opt:has(input:checked) { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 7%, var(--surface)); }
    .line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
    .line.total { font-weight: 800; font-size: 1.1rem; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
    .cart-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .footer { text-align: center; padding: 40px 16px 120px; }
  </style>
</head>
<body>
  <div id="app"><div class="empty">Carregando cardápio…</div></div>
  <script src="/common.js"></script>
  <script src="/menu.js"></script>
</body>
</html>
